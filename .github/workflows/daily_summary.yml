name: Daily Email Summary

on:
  schedule:
    # 5am Mountain Daylight Time = 11:00 UTC (MDT = UTC-6)
    # During Mountain Standard Time (Nov-Mar), this runs at 4am MST — adjust to 12:00 UTC if needed
    - cron: '0 11 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  send-daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          USER_EMAIL: richardlwells@gmail.com
        run: python scripts/daily_email_summary.py
