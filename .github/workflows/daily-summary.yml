name: Daily Email Digest

on:
  schedule:
    # 5:00 AM MDT (UTC-6) = 11:00 UTC  |  5:00 AM MST (UTC-7) = 12:00 UTC
    # Runs at 11:00 UTC year-round (5am summer, 6am winter — adjust CRON_HOUR secret to override)
    - cron: '0 11 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and send daily digest
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID:      ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.GMAIL_REFRESH_TOKEN }}
          TO_EMAIL:             richardlwells@gmail.com
        run: python scripts/daily_summary.py
